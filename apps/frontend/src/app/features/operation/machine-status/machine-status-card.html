<p-card header="Machine" class="machine-status">
  <div class="machine-status__row">
    <p-tag [value]="statusLabel()" [severity]="statusSeverity()" />
  </div>

  <div class="actions">
    @if (!status().connected) {
      <p-button label="Connect" (onClick)="connect()" />
    } @else {
      <p-button label="Disconnect" severity="danger" [outlined]="true" (onClick)="confirmDisconnect()" />
    }
  </div>
</p-card>

<p-confirmDialog />
