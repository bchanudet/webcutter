<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [header]="isEditing ? 'Edit profile' : 'New profile'"
  [style]="{ width: '26rem' }"
>
  <form [formGroup]="form" class="form-stack">
    <div class="field">
      <label for="profile-name">Name</label>
      <input id="profile-name" type="text" pInputText formControlName="name" />
    </div>

    <div class="field">
      <span id="profile-color-label">Color</span>
      <div class="color-palette" role="radiogroup" aria-labelledby="profile-color-label">
        @for (color of colorPalette; track color) {
          <button
            type="button"
            class="color-swatch-button"
            [class.color-swatch-button--selected]="form.controls.color.value === color"
            [style.background]="color"
            [attr.aria-pressed]="form.controls.color.value === color"
            [title]="color"
            (click)="form.controls.color.setValue(color)"
          ></button>
        }
      </div>
    </div>

    <div class="field">
      <label for="profile-mode">Mode</label>
      <p-select
        inputId="profile-mode"
        formControlName="mode"
        [options]="modeOptions"
        optionLabel="label"
        optionValue="value"
      />
    </div>

    <div class="field-row">
      <div class="field">
        <label for="profile-power">Laser power (%)</label>
        <p-inputnumber inputId="profile-power" formControlName="powerPercent" [min]="0" [max]="100" suffix=" %" />
      </div>
      <div class="field">
        <label for="profile-speed">Speed (mm/min)</label>
        <p-inputnumber inputId="profile-speed" formControlName="speedMmPerMin" [min]="0" suffix=" mm/min" />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="profile-passes">Passes</label>
        <p-inputnumber inputId="profile-passes" formControlName="passes" [min]="1" />
      </div>
      @if (isFillMode) {
        <div class="field">
          <label for="profile-line-spacing">Line spacing (mm)</label>
          <p-inputnumber
            inputId="profile-line-spacing"
            formControlName="lineSpacingMm"
            [min]="0"
            [step]="0.05"
            [minFractionDigits]="2"
            suffix=" mm"
          />
        </div>
      }
    </div>
  </form>

  <ng-template pTemplate="footer">
    <p-button [text]="true" (onClick)="cancel()">Cancel</p-button>
    <p-button [disabled]="form.invalid" (onClick)="submit()">Save</p-button>
  </ng-template>
</p-dialog>
