<div class="workspace">
  <p-tabs [value]="activeTab()" class="workspace__tabs-nav">
    <p-tablist>
      <p-tab value="machine" (click)="navigateToTab('machine')">Machine</p-tab>
      <p-tab value="materials" (click)="navigateToTab('materials')">Materials</p-tab>
      <p-tab value="gcode" (click)="navigateToTab('gcode')">Custom G-code</p-tab>
    </p-tablist>
  </p-tabs>

  <div class="workspace__content">
    <router-outlet />
  </div>
</div>
