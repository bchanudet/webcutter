name: Release build artifacts

# Builds backend + frontend and publishes them as a GitHub Release every time
# main is updated. The production server never runs `npm ci`/`nx build` itself —
# see deploy/deploy.sh, which just downloads these release assets.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  NODE_VERSION: 24

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx nx build backend
      - run: tar czf backend.tar.gz -C dist/apps/backend .
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: backend.tar.gz
          retention-days: 14

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx nx run frontend:build:production
      - run: tar czf frontend.tar.gz -C dist/apps/frontend/browser .
      - uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: frontend.tar.gz
          retention-days: 14

  release:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: backend
      - uses: actions/download-artifact@v8
        with:
          name: frontend
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          tag="build-${{ github.run_number }}-${short_sha}"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "Automated build from ${GITHUB_SHA}" \
            backend.tar.gz frontend.tar.gz
